{% extends 'app/base.html' %}

{% block script %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"
          integrity="sha512-8ExARjWWkIllMlNzVg7JKq9RKWPlJABQUNq6YvAjE/HobctjH/NA+bSiDMDvouBVjp4Wwnf1VP1OEv7Zgjtuxw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script>
      const socket = io();  // defaults to same host + port as page
      var pid;

      socket.on("connect", () => {
          console.log("Connected to server:", socket.id);

          socket.emit("init_player", {
              player_id: pid
          });
      });

      socket.on("client", (data) => {
          console.log("Received screen update:", data);

          if (data.html) {
              $("#content").html(data.html);
          }
      })

      socket.on("teamtrigger", (data) => {
          console.log("Received team trigger:", data);

          socket.emit("get_team", {
              player_id: pid
          })
      })

      function selectPlayer() {
          pid = $("#player-select").val();

          console.log("Selecting player " + pid);
          socket.emit("select_player", {
              player_id: pid
          });
      }

      function submit(ans) {
          socket.emit("answer", {
              player_id: pid,
              answer: ans
          })
      }
  </script>

  <style>
      body {
          background-color: #222;
          color: white;
      }

      .container {
          display: none;
      }

      .titletext {
          font-size: 120pt;
          font-family: 'Roboto', sans-serif;
      }

      .tvtext {
          font-size: 75pt;
      }

      .section {
          height: 100vh;
          width: 100vw;
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
      }
  </style>
{% endblock %}

{% block nav %}
{% endblock %}

{% block content-full %}
  <div id="content" class="section"></div>
{% endblock %}
