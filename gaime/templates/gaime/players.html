{% extends 'app/base.html' %}

{% block content %}
  <div class="row">
    <div class="col-12 col-md-8 offset-md-2">
      <div class="card">
        <div class="card-body">
          <h2>Players</h2>
          <table class="table table-striped table-hover">
            <tr>
              <th>Name</th>
              <th>Team</th>
              <th>Points</th>
            </tr>
            {% for player in players %}
              <tr>
                <td>{{ player.name }}</td>
                <td>{{ player.get_group_display }}</td>
                <td>{{ player.points }}</td>
              </tr>
            {% endfor %}
          </table>
        </div>
      </div>

      <div class="card mt-3">
        <div class="card-body">
          <form action="{% url 'gaime_players' %}" method="post">
            {% csrf_token %}
            <h2>Import Players</h2>
            <p>Paste in format last, first</p>
            <textarea class="form-control" id="import-players" name="names" rows="10"></textarea>
            <button class="btn btn-grad mt-3" id="import-players-btn">Import</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
