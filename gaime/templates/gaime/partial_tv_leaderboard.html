<table class="table table-striped table-dark" style="width: 70vw;">
  {% for row in rows %}
    <tr>
      <th style="font-size: 40pt;">{{ forloop.counter }}</th>
      <td style="font-size: 40pt;">{{ row.0 }}</td>
      <td style="font-size: 40pt;">{{ row.1 }}</td>
    </tr>
  {% endfor %}
</table>
