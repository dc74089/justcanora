<table class="table table-striped table-hover">
  <tr>
    <th>Name</th>
    <th>Team</th>
    <th>Points</th>
    <th>Action</th>
  </tr>
  {% for player in players %}
    <tr>
      <td>{{ player.name }}</td>
      <td>{{ player.get_group_display }}</td>
      <td>{{ player.points }}</td>
      <td>
        <a class="btn btn-success" onclick="change_score('{{ player.id }}', 1)">&uparrow;</a>
        <a class="btn btn-danger" onclick="change_score('{{ player.id }}', -1)">&downarrow;</a>
      </td>
    </tr>
  {% endfor %}
</table>
