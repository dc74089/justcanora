server {
	listen 80;
	server_name default_server;

	client_max_body_size 100M;

	location / {
		proxy_pass http://unix:/app/bind/gunicorn.sock;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location /media {
		root /app;
	}

	location /static {
		root /app;
		expires 1d;
	}
}
