{% extends 'app/base.html' %}

{% block content %}
  <div class="row">
    {% for category in data %}
      <div class="col-12 col-md-4 mb-4">
        <h1>{{ category.label }}</h1>

        <table class="table table-striped table-hover">
          <thead>
          <tr>
            <th>Rank</th>
            <th>Student</th>
            <th>Value</th>
          </tr>
          </thead>
          {% for item in category.items %}
            <tr>
              <th>{{ forloop.counter }}</th>
              <td>{{ item.student }}</td>
              <td>{{ item.value }}</td>
            </tr>
          {% endfor %}
        </table>
      </div>
    {% endfor %}
  </div>
{% endblock %}
